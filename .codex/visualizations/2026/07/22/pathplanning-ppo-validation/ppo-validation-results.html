<div id="ppo-validation-results">
  <style>
    #ppo-validation-results {
      color: var(--foreground);
      font-family: inherit;
      width: 100%;
    }
    #ppo-validation-results .plot-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px 24px;
    }
    #ppo-validation-results figure {
      margin: 0;
      min-width: 0;
    }
    #ppo-validation-results figcaption {
      margin-bottom: 8px;
      font-weight: 500;
    }
    #ppo-validation-results .context {
      display: block;
      color: var(--muted-foreground);
      font-weight: 400;
      margin-top: 3px;
    }
    #ppo-validation-results svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #ppo-validation-results .axis,
    #ppo-validation-results .gridline {
      stroke: var(--border);
      vector-effect: non-scaling-stroke;
    }
    #ppo-validation-results .gridline { opacity: 0.65; }
    #ppo-validation-results .label,
    #ppo-validation-results .tick,
    #ppo-validation-results .annotation {
      fill: var(--foreground);
      font-family: inherit;
    }
    #ppo-validation-results .tick,
    #ppo-validation-results .annotation-muted {
      fill: var(--muted-foreground);
      font-family: inherit;
    }
    #ppo-validation-results .bar { fill: var(--viz-series-3, var(--primary)); }
    #ppo-validation-results .gap-low { fill: var(--viz-series-6, var(--primary)); }
    #ppo-validation-results .gap-mid { fill: var(--viz-series-2, var(--primary)); }
    #ppo-validation-results .gap-high { fill: var(--viz-series-4, var(--destructive)); }
    #ppo-validation-results .gap-severe { fill: var(--destructive); }
    #ppo-validation-results .line {
      fill: none;
      stroke: var(--viz-series-1, var(--primary));
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }
    #ppo-validation-results .point { fill: var(--viz-series-1, var(--primary)); }
    #ppo-validation-results .guide {
      stroke: var(--viz-series-5, var(--primary));
      stroke-width: 1.5;
      stroke-dasharray: 5 4;
      vector-effect: non-scaling-stroke;
    }
    #ppo-validation-results .optimal { fill: var(--viz-series-3, var(--primary)); }
    #ppo-validation-results .suboptimal { fill: var(--viz-series-2, var(--destructive)); }
    #ppo-validation-results .worst { fill: var(--destructive); }
    #ppo-validation-results .track { fill: var(--muted); }
    @media (max-width: 620px) {
      #ppo-validation-results .plot-grid { grid-template-columns: 1fr; }
    }
  </style>

  <div class="plot-grid">
    <figure>
      <figcaption>
        Absolute gap distribution
        <span class="context">n=500 · mean 0.610 s · median 0 s · optimal 72.2%</span>
      </figcaption>
      <svg viewBox="0 0 520 300" role="img" aria-labelledby="gap-hist-title gap-hist-desc">
        <title id="gap-hist-title">Histogram of absolute PPO optimality gaps</title>
        <desc id="gap-hist-desc">361 cases are optimal. The remaining cases are grouped into six positive-gap intervals up to ten seconds.</desc>
        <line class="gridline" x1="54" y1="230" x2="504" y2="230" />
        <line class="gridline" x1="54" y1="174" x2="504" y2="174" />
        <line class="gridline" x1="54" y1="118" x2="504" y2="118" />
        <line class="gridline" x1="54" y1="62" x2="504" y2="62" />
        <text class="tick" x="45" y="234" text-anchor="end">0</text>
        <text class="tick" x="45" y="178" text-anchor="end">100</text>
        <text class="tick" x="45" y="122" text-anchor="end">200</text>
        <text class="tick" x="45" y="66" text-anchor="end">300</text>
        <text class="tick" x="45" y="24" text-anchor="end">cases</text>

        <rect class="bar" x="70" y="28" width="48" height="202" rx="3" />
        <rect class="gap-low" x="132" y="220" width="48" height="10" rx="3" />
        <rect class="gap-low" x="194" y="213" width="48" height="17" rx="3" />
        <rect class="gap-mid" x="256" y="218" width="48" height="12" rx="3" />
        <rect class="gap-mid" x="318" y="214" width="48" height="16" rx="3" />
        <rect class="gap-high" x="380" y="210" width="48" height="20" rx="3" />
        <rect class="gap-severe" x="442" y="227" width="48" height="3" rx="2" />

        <text class="label" x="94" y="20" text-anchor="middle">361</text>
        <text class="label" x="156" y="212" text-anchor="middle">18</text>
        <text class="label" x="218" y="205" text-anchor="middle">30</text>
        <text class="label" x="280" y="210" text-anchor="middle">22</text>
        <text class="label" x="342" y="206" text-anchor="middle">28</text>
        <text class="label" x="404" y="202" text-anchor="middle">35</text>
        <text class="label" x="466" y="219" text-anchor="middle">6</text>

        <text class="tick" x="94" y="250" text-anchor="middle">0</text>
        <text class="tick" x="156" y="250" text-anchor="middle">0–0.5</text>
        <text class="tick" x="218" y="250" text-anchor="middle">0.5–1</text>
        <text class="tick" x="280" y="250" text-anchor="middle">1–2</text>
        <text class="tick" x="342" y="250" text-anchor="middle">2–3</text>
        <text class="tick" x="404" y="250" text-anchor="middle">3–5</text>
        <text class="tick" x="466" y="250" text-anchor="middle">5–10</text>
        <text class="annotation-muted" x="279" y="280" text-anchor="middle">absolute gap (seconds)</text>
      </svg>
    </figure>

    <figure>
      <figcaption>
        Cumulative gap coverage
        <span class="context">81.8% are within 1 s · 90% are within about 2.57 s</span>
      </figcaption>
      <svg viewBox="0 0 520 300" role="img" aria-labelledby="gap-cdf-title gap-cdf-desc">
        <title id="gap-cdf-title">Cumulative distribution of absolute gaps</title>
        <desc id="gap-cdf-desc">The curve starts at 72.2 percent optimal cases and reaches 100 percent at a ten-second gap.</desc>
        <line class="gridline" x1="54" y1="230" x2="500" y2="230" />
        <line class="gridline" x1="54" y1="162.5" x2="500" y2="162.5" />
        <line class="gridline" x1="54" y1="95" x2="500" y2="95" />
        <line class="gridline" x1="54" y1="27.5" x2="500" y2="27.5" />
        <text class="tick" x="46" y="234" text-anchor="end">70%</text>
        <text class="tick" x="46" y="166.5" text-anchor="end">80%</text>
        <text class="tick" x="46" y="99" text-anchor="end">90%</text>
        <text class="tick" x="46" y="31.5" text-anchor="end">100%</text>
        <line class="guide" x1="168.6" y1="95" x2="168.6" y2="230" />
        <path class="line" d="M54,215.2 L65.2,207.1 L76.3,189.5 L87.5,163.9 L98.6,153.1 L109.8,146.4 L120.9,135.6 L132.1,130.2 L143.2,122.1 L154.4,114.0 L165.5,100.4 L176.7,92.3 L187.8,84.2 L199.0,74.8 L210.1,69.4 L221.3,62.6 L232.4,55.9 L243.6,53.2 L254.7,53.2 L265.9,43.7 L277.0,38.3 L288.2,35.6 L299.3,35.6 L310.5,35.6 L321.6,34.3 L332.8,34.3 L343.9,32.9 L355.1,32.9 L366.2,32.9 L377.4,32.9 L388.5,32.9 L399.7,31.6 L410.8,31.6 L422.0,31.6 L433.1,31.6 L444.3,31.6 L455.4,31.6 L466.6,31.6 L477.7,31.6 L488.9,31.6 L500,27.5" />
        <circle class="point" cx="98.6" cy="153.1" r="4" />
        <circle class="point" cx="168.6" cy="95" r="4" />
        <text class="annotation" x="104" y="143">1 s → 81.8%</text>
        <text class="annotation" x="175" y="86">P90 ≈ 2.57 s</text>
        <text class="tick" x="54" y="250" text-anchor="middle">0</text>
        <text class="tick" x="143.2" y="250" text-anchor="middle">2</text>
        <text class="tick" x="232.4" y="250" text-anchor="middle">4</text>
        <text class="tick" x="321.6" y="250" text-anchor="middle">6</text>
        <text class="tick" x="410.8" y="250" text-anchor="middle">8</text>
        <text class="tick" x="500" y="250" text-anchor="middle">10</text>
        <text class="annotation-muted" x="277" y="280" text-anchor="middle">maximum allowed absolute gap (seconds)</text>
      </svg>
    </figure>

    <figure>
      <figcaption>
        Optimal versus suboptimal by case type
        <span class="context">Zero-cost cases remain policy-relevant because every case contains a real branch</span>
      </figcaption>
      <svg viewBox="0 0 520 245" role="img" aria-labelledby="subset-title subset-desc">
        <title id="subset-title">Optimal and suboptimal proportions by exact cost</title>
        <desc id="subset-desc">For exact-zero cases, 184 of 225 are optimal. For positive exact-cost cases, 177 of 275 are optimal.</desc>
        <text class="label" x="15" y="59">Exact = 0</text>
        <rect class="track" x="125" y="35" width="365" height="38" rx="4" />
        <rect class="optimal" x="125" y="35" width="298.5" height="38" rx="4" />
        <rect class="suboptimal" x="423.5" y="35" width="66.5" height="38" rx="4" />
        <text class="label" x="125" y="27">184 optimal · 81.8%</text>
        <text class="label" x="456.5" y="96" text-anchor="middle">41</text>

        <text class="label" x="15" y="146">Exact &gt; 0</text>
        <rect class="track" x="125" y="122" width="365" height="38" rx="4" />
        <rect class="optimal" x="125" y="122" width="234.9" height="38" rx="4" />
        <rect class="suboptimal" x="359.9" y="122" width="130.1" height="38" rx="4" />
        <text class="label" x="125" y="114">177 optimal · 64.4%</text>
        <text class="label" x="425" y="183" text-anchor="middle">98 suboptimal</text>

        <rect class="optimal" x="125" y="210" width="14" height="10" rx="2" />
        <text class="tick" x="146" y="219">Exact-optimal</text>
        <rect class="suboptimal" x="267" y="210" width="14" height="10" rx="2" />
        <text class="tick" x="288" y="219">Positive gap</text>
      </svg>
    </figure>

    <figure>
      <figcaption>
        Ten largest errors
        <span class="context">Worst case: episode 244 · PPO 13.425 s versus exact 3.434 s</span>
      </figcaption>
      <svg viewBox="0 0 560 330" role="img" aria-labelledby="worst-title worst-desc">
        <title id="worst-title">Ten validation cases with the largest absolute gaps</title>
        <desc id="worst-desc">Episode 244 has the largest gap at 9.991 seconds, followed by episode 180 at 7.566 seconds.</desc>
        <line class="gridline" x1="77" y1="285" x2="489" y2="285" />
        <line class="gridline" x1="283" y1="15" x2="283" y2="285" />
        <line class="gridline" x1="489" y1="15" x2="489" y2="285" />

        <text class="tick" x="66" y="34" text-anchor="end">#244</text><rect class="worst" x="77" y="20" width="412" height="16" rx="2" /><text class="label" x="496" y="33">9.99 s</text>
        <text class="tick" x="66" y="60" text-anchor="end">#180</text><rect class="worst" x="77" y="46" width="312" height="16" rx="2" /><text class="label" x="396" y="59">7.57 s</text>
        <text class="tick" x="66" y="86" text-anchor="end">#115</text><rect class="worst" x="77" y="72" width="259" height="16" rx="2" /><text class="label" x="343" y="85">6.29 s</text>
        <text class="tick" x="66" y="112" text-anchor="end">#398</text><rect class="worst" x="77" y="98" width="247" height="16" rx="2" /><text class="label" x="331" y="111">6.00 s</text>
        <text class="tick" x="66" y="138" text-anchor="end">#308</text><rect class="worst" x="77" y="124" width="212" height="16" rx="2" /><text class="label" x="296" y="137">5.14 s</text>
        <text class="tick" x="66" y="164" text-anchor="end">#49</text><rect class="worst" x="77" y="150" width="212" height="16" rx="2" /><text class="label" x="296" y="163">5.14 s</text>
        <text class="tick" x="66" y="190" text-anchor="end">#273</text><rect class="worst" x="77" y="176" width="203" height="16" rx="2" /><text class="label" x="287" y="189">4.93 s</text>
        <text class="tick" x="66" y="216" text-anchor="end">#281</text><rect class="worst" x="77" y="202" width="200" height="16" rx="2" /><text class="label" x="284" y="215">4.86 s</text>
        <text class="tick" x="66" y="242" text-anchor="end">#95</text><rect class="worst" x="77" y="228" width="200" height="16" rx="2" /><text class="label" x="284" y="241">4.86 s</text>
        <text class="tick" x="66" y="268" text-anchor="end">#85</text><rect class="worst" x="77" y="254" width="200" height="16" rx="2" /><text class="label" x="284" y="267">4.85 s</text>

        <text class="tick" x="77" y="305" text-anchor="middle">0</text>
        <text class="tick" x="283" y="305" text-anchor="middle">5</text>
        <text class="tick" x="489" y="305" text-anchor="middle">10 s</text>

  </div>
</div>
